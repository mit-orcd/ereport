name: rpm

# Build RPMs on every push to main (or on demand) via the Makefile recipe
# (`make rpm RELEASE=<rel>` — engine/image/container handling lives in the
# Makefile); each distro's RPMs + SRPM land in its artifact
# "rpms-rocky<rel>-<shortsha>".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpms:
    name: RPM (Rocky Linux ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["8", "9", "10"]
    steps:
      - uses: actions/checkout@v4

      - name: Build RPMs
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          make rpm RELEASE=${{ matrix.release }}

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms-rocky${{ matrix.release }}-${{ env.short }}
          path: rpmbuild/artifacts/el${{ matrix.release }}
          if-no-files-found: error
